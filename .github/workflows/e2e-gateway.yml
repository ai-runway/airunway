name: E2E Gateway Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load component versions
        run: |
          set -a
          source versions.env
          set +a
          echo "GAIE_VERSION=${GAIE_VERSION}" >> "$GITHUB_ENV"
          echo "KAITO_VERSION=${KAITO_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: controller/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Kind
        run: |
          go install sigs.k8s.io/kind@latest
          kind create cluster --name airunway-gw-e2e --wait 120s
          # Allow workloads on control plane node for LoadBalancer access
          kubectl label node airunway-gw-e2e-control-plane node.kubernetes.io/exclude-from-external-load-balancers- 2>/dev/null || true

      - name: Install cloud-provider-kind
        run: |
          # Pinned: cloud-provider-kind v0.11.0+ requires Go 1.26. This job runs
          # Go 1.25, and actions/setup-go exports GOTOOLCHAIN=local (which forbids
          # auto-downloading a newer toolchain), so `@latest` fails to install.
          # v0.10.0 is the newest release that builds on Go 1.25.
          go install sigs.k8s.io/cloud-provider-kind@v0.10.0
          cloud-provider-kind &
          sleep 5
          echo "✅ cloud-provider-kind running"

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/latest/download/standard-install.yaml

      - name: Install Gateway API Inference Extension CRDs
        run: |
          kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/${GAIE_VERSION}/manifests.yaml"

      - name: Install Istio with Inference Extension support
        run: |
          curl -L https://istio.io/downloadIstio | sh -
          cd istio-*/bin
          ./istioctl install --set profile=minimal \
            --set values.pilot.env.ENABLE_GATEWAY_API_INFERENCE_EXTENSION=true -y
          kubectl wait --for=condition=Available deployment/istiod -n istio-system --timeout=120s
          echo "✅ Istio installed"

      - name: Install KAITO operator
        run: |
          helm repo add kaito https://kaito-project.github.io/kaito/charts/kaito
          # If Gateway API Inference Extension CRDs are pre-installed (e.g. via kubectl apply),
          # add --skip-crds to avoid a field-manager conflict on InferencePool.
          helm install kaito-workspace kaito/workspace \
            --version "$KAITO_VERSION" \
            --namespace kaito-workspace \
            --create-namespace \
            --set featureGates.disableNodeAutoProvisioning=true
          kubectl wait --for=condition=Available deployment -n kaito-workspace -l app.kubernetes.io/name=workspace --timeout=120s

      - name: Build and deploy controller
        run: |
          make controller-docker-build CONTROLLER_IMG=airunway-controller:e2e
          kind load docker-image airunway-controller:e2e --name airunway-gw-e2e
          make controller-deploy CONTROLLER_IMG=airunway-controller:e2e
          kubectl wait --for=condition=Available deployment -n airunway-system -l control-plane=controller-manager --timeout=120s

      - name: Build and deploy KAITO provider
        run: |
          make -C providers/kaito docker-build IMG=kaito-provider:e2e
          kind load docker-image kaito-provider:e2e --name airunway-gw-e2e
          make -C providers/kaito deploy IMG=kaito-provider:e2e
          kubectl wait --for=condition=Available deployment -n airunway-system -l control-plane=kaito-provider --timeout=120s

      - name: Wait for provider registration
        run: |
          kubectl wait --for=jsonpath='{.status.ready}'=true inferenceproviderconfig/kaito --timeout=120s

      - name: Create Gateway resource
        run: |
          kubectl apply -f controller/test/e2e/testdata/gateway.yaml
          echo "Waiting for Gateway to be programmed..."
          for i in $(seq 1 30); do
            PROGRAMMED=$(kubectl get gateway inference-gateway -o jsonpath='{.status.conditions[?(@.type=="Programmed")].status}' 2>/dev/null || echo "")
            if [ "$PROGRAMMED" = "True" ]; then
              echo "✅ Gateway is programmed"
              break
            fi
            echo "Attempt $i/30: programmed=$PROGRAMMED"
            if [ "$i" = "30" ]; then
              echo "⚠️ Gateway not programmed after 30 attempts, continuing anyway (Kind may not support LoadBalancer)"
            fi
            sleep 5
          done

      - name: Create two ModelDeployments with distinct gateway model names
        run: |
          kubectl apply -f controller/test/e2e/testdata/gateway-modeldeployments.yaml

      - name: Wait for both ModelDeployments to reach Running phase
        run: |
          set -euo pipefail
          models=(llama-gw-e2e gemma-gw-e2e)

          echo "Waiting for both ModelDeployments to reach Running phase..."
          for attempt in $(seq 1 90); do
            running=0
            for model in "${models[@]}"; do
              phase=$(kubectl get modeldeployment "$model" -n default \
                -o jsonpath='{.status.phase}' 2>/dev/null || true)
              echo "Attempt ${attempt}/90: ${model} phase=${phase}"
              if [ "$phase" = "Running" ]; then
                running=$((running + 1))
              fi
            done

            if [ "$running" -eq "${#models[@]}" ]; then
              echo "✅ Both ModelDeployments are Running"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Timed out waiting for both ModelDeployments to reach Running phase"
          exit 1

      - name: Verify isolated gateway resources for both models
        run: |
          set -euo pipefail

          wait_for_resource() {
            local kind="$1"
            local name="$2"
            for attempt in $(seq 1 30); do
              if kubectl get "$kind" "$name" -n default >/dev/null 2>&1; then
                return 0
              fi
              echo "Attempt ${attempt}/30: waiting for ${kind}/${name}"
              sleep 5
            done
            echo "❌ Timed out waiting for ${kind}/${name}"
            return 1
          }

          assert_equal() {
            local description="$1"
            local expected="$2"
            local actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "❌ ${description}: expected '${expected}', got '${actual}'"
              return 1
            fi
          }

          verify_model_resources() {
            local model="$1"
            local routed_model_name="$2"
            local epp="${model}-epp"

            wait_for_resource inferencepool "$model"
            wait_for_resource httproute "$model"
            wait_for_resource deployment "$epp"
            wait_for_resource service "$epp"
            kubectl rollout status "deployment/${epp}" -n default --timeout=300s

            local pool_selector
            local pool_epp
            local pool_epp_port
            local pool_owner
            pool_selector=$(kubectl get inferencepool "$model" -n default \
              -o jsonpath='{.spec.selector.matchLabels.airunway\.ai/model-deployment}')
            pool_epp=$(kubectl get inferencepool "$model" -n default \
              -o jsonpath='{.spec.endpointPickerRef.name}')
            pool_epp_port=$(kubectl get inferencepool "$model" -n default \
              -o jsonpath='{.spec.endpointPickerRef.port.number}')
            pool_owner=$(kubectl get inferencepool "$model" -n default \
              -o jsonpath='{.metadata.ownerReferences[?(@.kind=="ModelDeployment")].name}')
            assert_equal "${model} InferencePool selector" "$model" "$pool_selector"
            assert_equal "${model} InferencePool endpoint picker" "$epp" "$pool_epp"
            assert_equal "${model} InferencePool endpoint picker port" "9002" "$pool_epp_port"
            assert_equal "${model} InferencePool owner" "$model" "$pool_owner"

            local deployment_instance
            local deployment_owner
            local service_instance
            local service_owner
            deployment_instance=$(kubectl get deployment "$epp" -n default \
              -o jsonpath='{.spec.template.metadata.labels.app\.kubernetes\.io/instance}')
            deployment_owner=$(kubectl get deployment "$epp" -n default \
              -o jsonpath='{.metadata.ownerReferences[?(@.kind=="ModelDeployment")].name}')
            service_instance=$(kubectl get service "$epp" -n default \
              -o jsonpath='{.spec.selector.app\.kubernetes\.io/instance}')
            service_owner=$(kubectl get service "$epp" -n default \
              -o jsonpath='{.metadata.ownerReferences[?(@.kind=="ModelDeployment")].name}')
            assert_equal "${model} EPP Deployment instance" "$model" "$deployment_instance"
            assert_equal "${model} EPP Deployment owner" "$model" "$deployment_owner"
            assert_equal "${model} EPP Service selector" "$model" "$service_instance"
            assert_equal "${model} EPP Service owner" "$model" "$service_owner"

            local route_parent
            local route_parent_namespace
            local route_header_name
            local route_header_value
            local route_backend_group
            local route_backend_kind
            local route_backend_name
            local route_backend_namespace
            local route_owner
            route_parent=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.parentRefs[0].name}')
            route_parent_namespace=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.parentRefs[0].namespace}')
            route_header_name=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.rules[0].matches[0].headers[0].name}')
            route_header_value=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.rules[0].matches[0].headers[0].value}')
            route_backend_group=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.rules[0].backendRefs[0].group}')
            route_backend_kind=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.rules[0].backendRefs[0].kind}')
            route_backend_name=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')
            route_backend_namespace=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.spec.rules[0].backendRefs[0].namespace}')
            route_owner=$(kubectl get httproute "$model" -n default \
              -o jsonpath='{.metadata.ownerReferences[?(@.kind=="ModelDeployment")].name}')
            assert_equal "${model} HTTPRoute parent" "inference-gateway" "$route_parent"
            assert_equal "${model} HTTPRoute parent namespace" "default" "$route_parent_namespace"
            assert_equal "${model} HTTPRoute match header" "X-Gateway-Model-Name" "$route_header_name"
            assert_equal "${model} HTTPRoute model match" "$routed_model_name" "$route_header_value"
            assert_equal "${model} HTTPRoute backend group" "inference.networking.k8s.io" "$route_backend_group"
            assert_equal "${model} HTTPRoute backend kind" "InferencePool" "$route_backend_kind"
            assert_equal "${model} HTTPRoute backend name" "$model" "$route_backend_name"
            assert_equal "${model} HTTPRoute backend namespace" "default" "$route_backend_namespace"
            assert_equal "${model} HTTPRoute owner" "$model" "$route_owner"

            echo "✅ ${model} has an isolated InferencePool, EPP Deployment/Service, and HTTPRoute"
          }

          verify_model_resources llama-gw-e2e llama-3.2-1b-instruct
          verify_model_resources gemma-gw-e2e gemma-2-2b-instruct

      - name: Verify gateway status has two distinct model names
        run: |
          set -euo pipefail

          wait_for_gateway_ready() {
            local model="$1"
            for attempt in $(seq 1 30); do
              local ready
              ready=$(kubectl get modeldeployment "$model" -n default \
                -o jsonpath='{.status.conditions[?(@.type=="GatewayReady")].status}' 2>/dev/null || true)
              if [ "$ready" = "True" ]; then
                return 0
              fi
              echo "Attempt ${attempt}/30: ${model} GatewayReady=${ready}"
              sleep 5
            done
            echo "❌ Timed out waiting for ${model} GatewayReady=True"
            return 1
          }

          wait_for_gateway_ready llama-gw-e2e
          wait_for_gateway_ready gemma-gw-e2e

          llama_model=$(kubectl get modeldeployment llama-gw-e2e -n default \
            -o jsonpath='{.status.gateway.modelName}')
          gemma_model=$(kubectl get modeldeployment gemma-gw-e2e -n default \
            -o jsonpath='{.status.gateway.modelName}')

          if [ "$llama_model" != "llama-3.2-1b-instruct" ]; then
            echo "❌ llama-gw-e2e gateway model name mismatch: ${llama_model}"
            exit 1
          fi
          if [ "$gemma_model" != "gemma-2-2b-instruct" ]; then
            echo "❌ gemma-gw-e2e gateway model name mismatch: ${gemma_model}"
            exit 1
          fi
          if [ "$llama_model" = "$gemma_model" ]; then
            echo "❌ Gateway model names must be distinct"
            exit 1
          fi
          echo "✅ Gateway status exposes distinct model names: ${llama_model}, ${gemma_model}"

      - name: Install Body-Based Router (BBR)
        run: |
          helm install body-based-router \
            --set provider.name=istio \
            --version "${GAIE_VERSION}" \
            oci://registry.k8s.io/gateway-api-inference-extension/charts/body-based-routing \
            --wait --timeout 120s
          echo "✅ BBR installed"

      - name: Test both models through the same Gateway endpoint
        run: |
          set -euo pipefail

          gateway_address=""
          for attempt in $(seq 1 30); do
            gateway_address=$(kubectl get gateway inference-gateway -n default \
              -o jsonpath='{.status.addresses[0].value}' 2>/dev/null || true)
            if [ -n "$gateway_address" ]; then
              break
            fi
            echo "Attempt ${attempt}/30: waiting for Gateway address"
            sleep 5
          done
          if [ -z "$gateway_address" ]; then
            echo "❌ Gateway address was not assigned"
            exit 1
          fi
          gateway_url="http://${gateway_address}"
          echo "GATEWAY_URL=${gateway_url}" >> "$GITHUB_ENV"

          send_inference() {
            local deployment="$1"
            local routed_model_name="$2"
            local response_file="/tmp/${deployment}-response.json"

            for attempt in $(seq 1 12); do
              local http_code
              local response
              http_code=$(curl -sS -o "$response_file" -w '%{http_code}' --max-time 15 \
                "${gateway_url}/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -d "{
                  \"model\": \"${routed_model_name}\",
                  \"messages\": [{\"role\": \"user\", \"content\": \"Say hello in one word.\"}],
                  \"max_tokens\": 16
                }" 2>/dev/null || true)
              response=$(cat "$response_file" 2>/dev/null || true)

              if [ "$http_code" = "200" ] && \
                printf '%s' "$response" | jq -e \
                  '.choices[0].message.content | type == "string" and length > 0' >/dev/null 2>&1; then
                echo "✅ ${deployment} routed successfully through ${gateway_url} with model=${routed_model_name}"
                return 0
              fi
              echo "Attempt ${attempt}/12: ${deployment} HTTP=${http_code} body=${response:0:200}"
              sleep 10
            done

            echo "❌ ${deployment} did not route successfully with model=${routed_model_name}"
            return 1
          }

          send_inference llama-gw-e2e llama-3.2-1b-instruct
          send_inference gemma-gw-e2e gemma-2-2b-instruct

      - name: Disable one model and verify isolated cleanup
        run: |
          set -euo pipefail

          kubectl patch modeldeployment llama-gw-e2e -n default \
            --type=merge -p '{"spec":{"gateway":{"enabled":false}}}'

          removed_resources=(
            inferencepool/llama-gw-e2e
            httproute/llama-gw-e2e
            deployment/llama-gw-e2e-epp
            service/llama-gw-e2e-epp
          )
          remaining=()
          for attempt in $(seq 1 30); do
            remaining=()
            for resource in "${removed_resources[@]}"; do
              if kubectl get "$resource" -n default >/dev/null 2>&1; then
                remaining+=("$resource")
              fi
            done
            if [ "${#remaining[@]}" -eq 0 ]; then
              break
            fi
            echo "Attempt ${attempt}/30: waiting to remove ${remaining[*]}"
            sleep 5
          done
          if [ "${#remaining[@]}" -ne 0 ]; then
            echo "❌ Disabled model still has gateway resources: ${remaining[*]}"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            gateway_ready=$(kubectl get modeldeployment llama-gw-e2e -n default \
              -o jsonpath='{.status.conditions[?(@.type=="GatewayReady")].status}' 2>/dev/null || true)
            if [ "$gateway_ready" = "False" ]; then
              break
            fi
            echo "Attempt ${attempt}/30: llama-gw-e2e GatewayReady=${gateway_ready}"
            sleep 5
          done
          if [ "$gateway_ready" != "False" ]; then
            echo "❌ llama-gw-e2e GatewayReady should be False after disabling integration"
            exit 1
          fi

          surviving_resources=(
            inferencepool/gemma-gw-e2e
            httproute/gemma-gw-e2e
            deployment/gemma-gw-e2e-epp
            service/gemma-gw-e2e-epp
          )
          for resource in "${surviving_resources[@]}"; do
            if ! kubectl get "$resource" -n default >/dev/null 2>&1; then
              echo "❌ Enabled model resource disappeared: ${resource}"
              exit 1
            fi
          done

          gemma_route_model=$(kubectl get httproute gemma-gw-e2e -n default \
            -o jsonpath='{.spec.rules[0].matches[0].headers[0].value}')
          gemma_route_backend=$(kubectl get httproute gemma-gw-e2e -n default \
            -o jsonpath='{.spec.rules[0].backendRefs[0].name}')
          gemma_gateway_ready=$(kubectl get modeldeployment gemma-gw-e2e -n default \
            -o jsonpath='{.status.conditions[?(@.type=="GatewayReady")].status}')
          if [ "$gemma_route_model" != "gemma-2-2b-instruct" ] || \
            [ "$gemma_route_backend" != "gemma-gw-e2e" ] || \
            [ "$gemma_gateway_ready" != "True" ]; then
            echo "❌ Enabled model lost its isolated route or ready status"
            exit 1
          fi

          response_file=/tmp/gemma-gw-e2e-after-disable-response.json
          for attempt in $(seq 1 12); do
            http_code=$(curl -sS -o "$response_file" -w '%{http_code}' --max-time 15 \
              "${GATEWAY_URL}/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -d '{
                "model": "gemma-2-2b-instruct",
                "messages": [{"role": "user", "content": "Say hello in one word."}],
                "max_tokens": 16
              }' 2>/dev/null || true)
            response=$(cat "$response_file" 2>/dev/null || true)
            if [ "$http_code" = "200" ] && \
              printf '%s' "$response" | jq -e \
                '.choices[0].message.content | type == "string" and length > 0' >/dev/null 2>&1; then
              echo "✅ llama-gw-e2e resources were removed and gemma-gw-e2e still routes through ${GATEWAY_URL}"
              exit 0
            fi
            echo "Attempt ${attempt}/12 after disable: HTTP=${http_code} body=${response:0:200}"
            sleep 10
          done

          echo "❌ gemma-gw-e2e stopped routing after llama-gw-e2e gateway integration was disabled"
          exit 1

      - name: Collect debug info
        if: failure()
        run: |
          echo "=== ModelDeployments ==="
          kubectl get modeldeployments -A -o yaml
          echo "=== InferencePools ==="
          kubectl get inferencepools -A -o yaml 2>/dev/null || echo "No InferencePools"
          echo "=== HTTPRoutes ==="
          kubectl get httproutes -A -o yaml 2>/dev/null || echo "No HTTPRoutes"
          echo "=== Gateways ==="
          kubectl get gateways -A -o yaml 2>/dev/null || echo "No Gateways"
          echo "=== Workspaces ==="
          kubectl get workspaces -A -o yaml
          echo "=== Controller Logs ==="
          kubectl logs -n airunway-system -l control-plane=controller-manager --tail=200
          echo "=== KAITO Provider Logs ==="
          kubectl logs -n airunway-system -l control-plane=kaito-provider --tail=100
          echo "=== EPP Logs ==="
          for epp in llama-gw-e2e-epp gemma-gw-e2e-epp; do
            echo "--- ${epp} ---"
            kubectl logs -n default "deployment/${epp}" --tail=100 2>/dev/null || echo "No ${epp} logs"
          done
          echo "=== Body-Based Router Logs ==="
          kubectl logs -n default -l app.kubernetes.io/name=body-based-routing --tail=100 2>/dev/null || echo "No BBR logs"
          echo "=== Istio Logs ==="
          kubectl logs -n istio-system -l app=istiod --tail=100 2>/dev/null || echo "No Istio logs"
          echo "=== Gateway Proxy Logs ==="
          GW_POD=$(kubectl get pods -n default -l gateway.networking.k8s.io/gateway-name=inference-gateway -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          [ -n "$GW_POD" ] && kubectl logs "$GW_POD" -n default --tail=50 2>/dev/null || echo "No gateway proxy logs"
          echo "=== Gateway Pods ==="
          kubectl get pods -n default -l gateway.networking.k8s.io/gateway-name=inference-gateway -o yaml
          echo "=== Events ==="
          kubectl get events -A --sort-by=.lastTimestamp
          echo "=== Pods ==="
          kubectl get pods -A

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name airunway-gw-e2e
