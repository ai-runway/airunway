name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: make compile

      - name: Run backend tests with coverage
        shell: bash
        run: |
          set -o pipefail
          rc=0
          make test-coverage-backend 2>&1 | tee /tmp/backend-cov.log || rc=$?
          {
            echo "## 🧪 Backend Test Coverage"
            echo ""
            echo '```'
            tail -20 /tmp/backend-cov.log
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Run frontend tests with coverage
        shell: bash
        run: |
          set -o pipefail
          rc=0
          make test-coverage-frontend 2>&1 | tee /tmp/frontend-cov.log || rc=$?
          {
            echo "## 🎨 Frontend Test Coverage"
            echo ""
            echo '```'
            tail -30 /tmp/frontend-cov.log
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  web-ui-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Lint (frontend + backend)
        run: make lint

  agent-image-source-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check agent runtime contracts and entrypoints
        run: make agent-images-test

  agent-images-docker-build:
    name: Build and smoke ${{ matrix.name }} agent image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CrewAI
            runtime: crewai
            image: agent-crewai
            dockerfile: images/agents/crewai/Dockerfile
            base_arg: PYTHON_BASE
            base_env: AGENT_PYTHON_BASE
          - name: LangGraph
            runtime: langgraph
            image: agent-langgraph
            dockerfile: images/agents/langgraph/Dockerfile
            base_arg: PYTHON_BASE
            base_env: AGENT_PYTHON_BASE
          - name: OpenClaw
            runtime: openclaw
            image: agent-openclaw
            dockerfile: images/agents/openclaw/Dockerfile
            base_arg: OPENCLAW_BASE
            base_env: AGENT_OPENCLAW_BASE
          - name: Hermes
            runtime: hermes
            image: agent-hermes
            dockerfile: images/agents/hermes/Dockerfile
            base_arg: HERMES_BASE
            base_env: AGENT_HERMES_BASE

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Load pinned agent base
        id: agent_base
        shell: bash
        env:
          BASE_ARG: ${{ matrix.base_arg }}
          BASE_ENV: ${{ matrix.base_env }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./versions.env
          set +a
          if [[ -z "${!BASE_ENV:-}" ]]; then
            echo "Missing ${BASE_ENV} in versions.env" >&2
            exit 1
          fi
          printf 'build_arg=%s=%s\n' "$BASE_ARG" "${!BASE_ENV}" >> "$GITHUB_OUTPUT"

      - name: Build agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: airunway/${{ matrix.image }}:ci
          build-args: ${{ steps.agent_base.outputs.build_arg }}
          cache-from: type=gha,scope=agent-test-${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=agent-test-${{ matrix.image }}-amd64

      - name: Run hardened container smoke test
        run: images/agents/smoke.sh "${{ matrix.runtime }}" "airunway/${{ matrix.image }}:ci"

      - name: Build arm64 agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          outputs: type=cacheonly
          build-args: ${{ steps.agent_base.outputs.build_arg }}
          cache-from: type=gha,scope=agent-test-${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=agent-test-${{ matrix.image }}-arm64

  agent-provider-images-docker-build:
    name: Build ${{ matrix.name }} agent provider image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Container
            image: agent-container-provider
            dockerfile: providers/agent-container/Dockerfile
          - name: Kagent
            image: agent-kagent-provider
            dockerfile: providers/agent-kagent/Dockerfile
          - name: Orka
            image: agent-orka-provider
            dockerfile: providers/agent-orka/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # These controllers need Kubernetes API discovery to run, so PR CI
      # exercises the complete image build for both release architectures
      # while provider-go-checks covers the executable behavior and version
      # injection without requiring a cluster.
      - name: Build amd64 and arm64 provider image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          build-args: |
            SHIM_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=agent-provider-test-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=agent-provider-test-${{ matrix.image }}

  controller-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Lint changed controller code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.7.2
          working-directory: controller
          args: >-
            --config=${{ github.workspace }}/.golangci.yml
            --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }}

  provider-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [agent-container, agent-kagent, agent-orka, dynamo, kaito, kuberay, llmd, vllm]

    name: provider-lint (${{ matrix.provider }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: providers/${{ matrix.provider }}/go.mod
          cache-dependency-path: providers/${{ matrix.provider }}/go.sum

      - name: Lint changed provider code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.7.2
          working-directory: providers/${{ matrix.provider }}
          args: >-
            --config=${{ github.workspace }}/.golangci.yml
            --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }}

  provider-shim-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: providers/pkg/shim/go.mod
          cache-dependency-path: providers/pkg/shim/go.sum

      - name: Lint changed provider shim code
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.7.2
          working-directory: providers/pkg/shim
          args: >-
            --config=${{ github.workspace }}/.golangci.yml
            --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Test provider shim
        run: go test -C providers/pkg/shim ./...

  actionlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Lint GitHub workflow files
        run: |
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml

      - name: Verify agent runtime publication contract
        shell: bash
        run: |
          set -euo pipefail
          expected_runtime_tag='type=raw,value=$'
          expected_runtime_tag+='{{ steps.agent_runtime_version.outputs.value }},priority=1000'
          if ! grep -Fq "$expected_runtime_tag" .github/workflows/release.yml; then
            echo "Release runtime images must publish the reported immutable revision tag" >&2
            exit 1
          fi
          for job in controller-docker agent-provider-images-docker; do
            if ! awk -v job="$job" '
              $0 == "  " job ":" { in_job = 1; next }
              in_job && /^  [A-Za-z0-9_-]+:$/ { exit }
              in_job && $0 == "    needs: agent-images-docker" { found = 1 }
              END { exit(found ? 0 : 1) }
            ' .github/workflows/release.yml; then
              echo "Release job $job must wait for agent-images-docker" >&2
              exit 1
            fi
          done

  controller-manifest-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: controller/go.sum

      - name: Install kustomize
        run: cd controller && make kustomize

      - name: Generate controller manifest
        run: |
          cd controller
          bin/kustomize build config/agentdeployment-webhook-guard > /tmp/agentdeployment-webhook-guard.yaml
          bin/kustomize build config/default > /tmp/controller.yaml
          bin/kustomize build config/agentdeployment-webhook > /tmp/agentdeployment-webhook.yaml

      - name: Check for manifest drift
        run: |
          if ! diff -u deploy/agentdeployment-webhook-guard.yaml /tmp/agentdeployment-webhook-guard.yaml; then
            echo "❌ deploy/agentdeployment-webhook-guard.yaml is out of date."
            echo "Run 'make generate-deploy-manifests' and commit the result."
            exit 1
          fi
          if ! diff -u deploy/controller.yaml /tmp/controller.yaml; then
            echo "❌ deploy/controller.yaml is out of date."
            echo "Run 'make generate-deploy-manifests' and commit the result."
            exit 1
          fi
          if ! diff -u deploy/agentdeployment-webhook.yaml /tmp/agentdeployment-webhook.yaml; then
            echo "❌ deploy/agentdeployment-webhook.yaml is out of date."
            echo "Run 'make generate-deploy-manifests' and commit the result."
            exit 1
          fi

      - name: Verify staged webhook configuration
        run: cd controller && make test-webhook-staging

      - name: Generate dashboard manifest
        run: controller/bin/kustomize build backend/config/default > /tmp/dashboard.yaml

      - name: Check for dashboard manifest drift
        run: |
          if ! diff -u deploy/dashboard.yaml /tmp/dashboard.yaml; then
            echo "❌ deploy/dashboard.yaml is out of date."
            echo "Run 'make generate-deploy-manifests' and commit the result."
            exit 1
          fi

  provider-go-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [dynamo, kaito, kuberay, llmd, vllm, agent-container, agent-kagent, agent-orka]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: providers/${{ matrix.provider }}/go.sum

      # `providers/{dynamo,llmd,vllm}/Makefile`'s `build` target depends on
      # `verify-versions`, which regenerates `shared/types/versions.generated.ts`
      # via bun. Install bun only for those three providers; kaito and kuberay
      # have `build: vet` (no verify-versions dependency) and don't need it.
      # Skipping conditionally avoids transient Bun download failures breaking
      # jobs that don't use Bun at all.
      - name: Setup Bun
        if: contains(fromJSON('["dynamo", "llmd", "vllm"]'), matrix.provider)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: make build
        run: make -C providers/${{ matrix.provider }} build

      # Assert the shimVersion injection survives future refactors. Checks (a)
      # and (b) read the -ldflags string recorded in the binary (proves the flag
      # was *passed*); check (c) asserts the *runtime* value of ProviderVersion
      # after injection (proves the linker actually *patched* the symbol). (c) is
      # the one that catches a silent -X no-op — e.g. shimVersion becoming a
      # const, being renamed, or ProviderVersion being retargeted — which (a)/(b)
      # cannot, since the flag is still present in those cases.
      - name: Assert shimVersion injection + git-stamp default
        run: |
          set -euo pipefail
          p=${{ matrix.provider }}
          mod=$(cd "providers/$p" && go list -m)
          # (a) the un-overridden build above used the Makefile git-stamp default
          #     (hex sha, or "unknown" outside a git tree — e.g. source tarball)
          go version -m "providers/$p/bin/provider" \
            | grep -Eq -- "-X ${mod}.shimVersion=dev-([0-9a-f]+|unknown)(-dirty)?" \
            || { echo "❌ git-stamp default missing in $p"; exit 1; }
          # (b) explicit override proves the injection flag is wired
          make -C "providers/$p" build SHIM_VERSION=v9.9.9-citest
          go version -m "providers/$p/bin/provider" \
            | grep -F -- "-X ${mod}.shimVersion=v9.9.9-citest" \
            || { echo "❌ shimVersion override injection missing in $p"; exit 1; }
          # (c) prove the injection actually takes EFFECT at runtime, not just
          #     that the flag was passed. Fails on a silent -X no-op.
          EXPECT_PROVIDER_VERSION="${p}-provider:v9.9.9-citest" \
            go test -C "providers/$p" \
              -ldflags "-X ${mod}.shimVersion=v9.9.9-citest" \
              -run TestShimVersionInjection -v ./... \
            || { echo "❌ shimVersion injection had no runtime effect in $p (silent no-op)"; exit 1; }

      - name: make test
        run: make -C providers/${{ matrix.provider }} test

  controller-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: controller/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Run controller unit tests
        run: |
          cd controller
          make test
          {
            echo "## 🎯 Controller Test Coverage"
            echo ""
            echo '```'
            go tool cover -func=cover.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test verify-versions guard
        run: make test-verify-versions

      - name: Build controller and assert ldflags injection
        # `make controller-build` delegates to controller/Makefile, which
        # injects both the pinned GAIE version and the in-process agent-provider
        # version via ldflags. Check the emitted link command and then confirm
        # both injected values actually landed in the binary.
        run: |
          set -euo pipefail
          gaie_version=ci-gaie-link-proof
          agent_provider_version=ci-agent-provider-link-proof
          build_command="$(
            make -C controller -n VERIFIED_VERSIONS=1 build \
              GAIE_VERSION="${gaie_version}" \
              AGENT_PROVIDER_VERSION="${agent_provider_version}"
          )"
          if ! grep -F -- "-X github.com/ai-runway/airunway/controller/internal/gateway.DefaultGAIEVersion=${gaie_version}" <<<"${build_command}"; then
            echo "❌ controller link flags omitted DefaultGAIEVersion=${gaie_version}"
            exit 1
          fi
          if ! grep -F -- "-X main.agentProviderVersion=${agent_provider_version}" <<<"${build_command}"; then
            echo "❌ controller link flags omitted agentProviderVersion=${agent_provider_version}"
            exit 1
          fi
          make -C controller VERIFIED_VERSIONS=1 build \
            GAIE_VERSION="${gaie_version}" \
            AGENT_PROVIDER_VERSION="${agent_provider_version}"
          if ! strings controller/bin/manager | grep -Fx -- "${gaie_version}"; then
            echo "❌ ldflags injection of DefaultGAIEVersion=${gaie_version} did not land in controller/bin/manager"
            exit 1
          fi
          if ! strings controller/bin/manager | grep -Fx -- "${agent_provider_version}"; then
            echo "❌ ldflags injection of agentProviderVersion=${agent_provider_version} did not land in controller/bin/manager"
            exit 1
          fi
          echo "✅ ldflags injection landed: DefaultGAIEVersion=${gaie_version}, agentProviderVersion=${agent_provider_version}"

      - name: Build dynamo provider and assert ldflags injection
        # Mirrors the controller assertion above. providers/dynamo/Makefile
        # injects -X .../providers/dynamo.DynamoVersion=$(DYNAMO_VERSION).
        # Note the binary is bin/provider, not bin/manager.
        run: |
          set -euo pipefail
          source versions.env
          cd providers/dynamo && make build && cd -
          if ! go version -m providers/dynamo/bin/provider \
            | grep -F -- "-X github.com/ai-runway/airunway/providers/dynamo.DynamoVersion=${DYNAMO_VERSION}"; then
            echo "❌ ldflags injection of DynamoVersion=${DYNAMO_VERSION} did not land in providers/dynamo/bin/provider"
            exit 1
          fi
          echo "✅ ldflags injection landed: DynamoVersion=${DYNAMO_VERSION}"

  gpu-e2e-check:
    # Cluster-free gate for the GPU e2e module (test/e2e/gpu). The full suite
    # needs a GPU cluster and runs out-of-band via scripts/gpu-e2e.sh, but the
    # module must still stay formatted, vet-clean, and compilable, and its
    # cluster-free packages (sched, e2eutil) carry real unit tests. This job
    # runs all of that on a plain runner so the e2e code can't silently rot
    # between GPU runs.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: test/e2e/gpu/go.mod

      - name: Run GPU e2e module checks
        run: make gpu-e2e-check
