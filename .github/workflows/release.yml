name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun ci

      - name: Verify generated versions are up to date
        run: make verify-versions

      - name: Build frontend
        run: bun run build:frontend

      - name: Embed assets
        run: cd backend && bun run embed

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Compile all binaries
        run: |
          cd backend
          VERSION=${{ steps.version.outputs.VERSION }} bun run compile:linux-x64
          VERSION=${{ steps.version.outputs.VERSION }} bun run compile:linux-arm64
          VERSION=${{ steps.version.outputs.VERSION }} bun run compile:darwin-x64
          VERSION=${{ steps.version.outputs.VERSION }} bun run compile:darwin-arm64
          VERSION=${{ steps.version.outputs.VERSION }} bun run compile:windows-x64

      - name: Prepare release assets
        run: |
          mkdir -p release
          VERSION=${{ steps.version.outputs.VERSION }}
          
          # Rename binaries with version
          mv dist/airunway-linux-x64 release/airunway-${VERSION}-linux-amd64
          mv dist/airunway-linux-arm64 release/airunway-${VERSION}-linux-arm64
          mv dist/airunway-darwin-x64 release/airunway-${VERSION}-darwin-amd64
          mv dist/airunway-darwin-arm64 release/airunway-${VERSION}-darwin-arm64
          mv dist/airunway-windows-x64.exe release/airunway-${VERSION}-windows-amd64.exe
          
          # Make binaries executable (except Windows)
          chmod +x release/airunway-${VERSION}-linux-amd64
          chmod +x release/airunway-${VERSION}-linux-arm64
          chmod +x release/airunway-${VERSION}-darwin-amd64
          chmod +x release/airunway-${VERSION}-darwin-arm64
          
          # Generate checksums
          cd release
          sha256sum ./airunway-* > checksums.txt
          cat checksums.txt

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          if [[ "$TAG" =~ -(alpha|beta|rc|dev) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          
          TAG="${{ steps.version.outputs.VERSION }}"
          PRERELEASE_FLAG=""
          
          if [ "${{ steps.prerelease.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          # Delete existing release if it exists (for re-runs)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, deleting..."
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
          
          # Create release with all assets
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ai-runway/airunway/dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-dev') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  controller-docker:
    name: Build and Push Controller Docker Image
    runs-on: ubuntu-latest
    # The in-process container provider reports a new build revision as soon as
    # this image is deployed. Publish the matching immutable runtime image tags
    # first so agents do not transiently fail to pull that revision.
    needs: agent-images-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select reported agent provider version
        id: agent_provider_version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version="main-${GITHUB_SHA::12}"
          else
            version="$GITHUB_REF_NAME"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ai-runway/airunway/controller
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-dev') }}

      - name: Load pinned versions
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./versions.env
          set +a
          echo "GAIE_VERSION=$GAIE_VERSION" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GAIE_VERSION=${{ env.GAIE_VERSION }}
            AGENT_PROVIDER_VERSION=${{ steps.agent_provider_version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  model-downloader-docker:
    name: Build and Push Model Downloader Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ai-runway/airunway/model-downloader
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-dev') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/model-downloader
          file: images/model-downloader/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-images-docker:
    name: Build and Push ${{ matrix.name }} Agent Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CrewAI
            image: agent-crewai
            dockerfile: images/agents/crewai/Dockerfile
            base_arg: PYTHON_BASE
            base_env: AGENT_PYTHON_BASE
          - name: LangGraph
            image: agent-langgraph
            dockerfile: images/agents/langgraph/Dockerfile
            base_arg: PYTHON_BASE
            base_env: AGENT_PYTHON_BASE
          - name: OpenClaw
            image: agent-openclaw
            dockerfile: images/agents/openclaw/Dockerfile
            base_arg: OPENCLAW_BASE
            base_env: AGENT_OPENCLAW_BASE
          - name: Hermes
            image: agent-hermes
            dockerfile: images/agents/hermes/Dockerfile
            base_arg: HERMES_BASE
            base_env: AGENT_HERMES_BASE
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select agent runtime image version
        id: agent_runtime_version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="main-${GITHUB_SHA::12}"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ai-runway/airunway/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.agent_runtime_version.outputs.value }},priority=1000
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-dev') }}

      - name: Load pinned agent base
        id: agent_base
        shell: bash
        env:
          BASE_ARG: ${{ matrix.base_arg }}
          BASE_ENV: ${{ matrix.base_env }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./versions.env
          set +a
          if [[ -z "${!BASE_ENV:-}" ]]; then
            echo "Missing ${BASE_ENV} in versions.env" >&2
            exit 1
          fi
          printf 'build_arg=%s=%s\n' "$BASE_ARG" "${!BASE_ENV}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.agent_base.outputs.build_arg }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  agent-provider-images-docker:
    name: Build and Push ${{ matrix.name }} Agent Provider Image
    runs-on: ubuntu-latest
    # The standalone container provider reports the same revision contract as
    # the combined controller, so it must observe the same publication barrier.
    needs: agent-images-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Container
            image: agent-container-provider
            dockerfile: providers/agent-container/Dockerfile
          - name: Kagent
            image: agent-kagent-provider
            dockerfile: providers/agent-kagent/Dockerfile
          - name: Orka
            image: agent-orka-provider
            dockerfile: providers/agent-orka/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select reported provider version
        id: provider_version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="main-${GITHUB_SHA::12}"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ai-runway/airunway/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.provider_version.outputs.value }},priority=1000
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-dev') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHIM_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
