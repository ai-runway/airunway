name: Go Coverage Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-gate:
    name: coverage-${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: controller
            module: controller
            test_command: make test
            threshold: 54.0
          - id: dynamo
            module: providers/dynamo
            test_command: make cover
            threshold: 79.2
          - id: kaito
            module: providers/kaito
            test_command: make cover
            threshold: 83.6
          - id: kuberay
            module: providers/kuberay
            test_command: make cover
            threshold: 77.1
          - id: llmd
            module: providers/llmd
            test_command: make cover
            threshold: 65.5
          - id: vllm
            module: providers/vllm
            test_command: make cover
            threshold: 73.8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install go-test-coverage
        shell: bash
        run: |
          go install github.com/vladopajic/go-test-coverage/v2@v2.18.0
          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH)/bin"
          fi
          echo "$gobin" >> "$GITHUB_PATH"

      - name: Run tests and generate coverage profile
        working-directory: ${{ matrix.module }}
        run: ${{ matrix.test_command }}

      - name: Enforce coverage threshold
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          cat > .testcoverage.yml <<'EOF'
          profile: cover.out
          threshold:
            total: ${{ matrix.threshold }}
          EOF
          go-test-coverage --config=.testcoverage.yml

      - name: Publish coverage summary
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          total_line=$(go tool cover -func=cover.out | tail -1)
          {
            echo "## Coverage • ${{ matrix.id }}"
            echo ""
            echo '```'
            echo "$total_line"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
