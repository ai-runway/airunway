name: Go Coverage Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-gate:
    name: coverage-${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: controller
            module: controller
            test_command: make test
            threshold: 54.0
          - id: dynamo
            module: providers/dynamo
            test_command: make cover
            threshold: 79.1
          - id: kaito
            module: providers/kaito
            test_command: make cover
            threshold: 83.5
          - id: kuberay
            module: providers/kuberay
            test_command: make cover
            threshold: 76.9
          - id: llmd
            module: providers/llmd
            test_command: make cover
            threshold: 65.5
          - id: vllm
            module: providers/vllm
            test_command: make cover
            threshold: 73.8
          - id: pkg/shim
            module: providers/pkg/shim
            test_command: make cover
            threshold: 80.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Setup Bun for controller version verification
        if: matrix.id == 'controller'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Run tests and generate coverage profile
        working-directory: ${{ matrix.module }}
        run: ${{ matrix.test_command }}

      - name: Enforce coverage threshold
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          coverage=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          if [ -z "$coverage" ]; then
            echo "❌ Failed to read total coverage from cover.out"
            exit 1
          fi
          if ! awk -v coverage="$coverage" -v threshold="${{ matrix.threshold }}" 'BEGIN { exit !(coverage + 0 >= threshold + 0) }'; then
            echo "❌ Coverage ${coverage}% is below the ${{ matrix.threshold }}% threshold"
            exit 1
          fi
          echo "✅ Coverage ${coverage}% meets the ${{ matrix.threshold }}% threshold"

      - name: Publish coverage summary
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          total_line=$(go tool cover -func=cover.out | tail -1)
          {
            echo "## Coverage • ${{ matrix.id }}"
            echo ""
            echo '```'
            echo "$total_line"
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
