apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: airunway
  name: airunway-webhook-service
  namespace: airunway-system
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app.kubernetes.io/name: airunway
    control-plane: controller-manager
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: airunway-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: airunway-webhook-service
      namespace: airunway-system
      path: /mutate-airunway-ai-v1alpha1-agentdeployment
  failurePolicy: Fail
  name: magentdeployment-v1alpha1.kb.io
  reinvocationPolicy: IfNeeded
  rules:
  - apiGroups:
    - airunway.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - agentdeployments
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: airunway-webhook-service
      namespace: airunway-system
      path: /mutate-airunway-ai-v1alpha1-modeldeployment
  failurePolicy: Fail
  name: mmodeldeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - airunway.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modeldeployments
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: airunway-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: airunway-webhook-service
      namespace: airunway-system
      path: /validate-airunway-ai-v1alpha1-agentdeployment
  failurePolicy: Fail
  name: vagentdeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - airunway.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - agentdeployments
  sideEffects: NoneOnDryRun
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: airunway-webhook-service
      namespace: airunway-system
      path: /validate-airunway-ai-v1alpha1-modeldeployment
  failurePolicy: Fail
  name: vmodeldeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - airunway.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modeldeployments
  sideEffects: None
