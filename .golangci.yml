version: "2"
run:
  allow-parallel-runners: true
  relative-path-mode: gitroot
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocognit
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 50
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: ^(controller/)?api/
      - linters:
          - lll
        path: ^(controller/)?internal/
      - linters:
          - dupl
          - lll
        path: _test\.go$
    paths:
      - ^controller/(third_party|builtin|examples)(/|$)
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^controller/(third_party|builtin|examples)(/|$)
