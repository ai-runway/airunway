apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: airunway-dynamo-provider-role
rules:
- apiGroups:
  - airunway.ai
  resources:
  - modeldeployments
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - airunway.ai
  resources:
  - modeldeployments/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - airunway.ai
  resources:
  - modeldeployments/finalizers
  verbs:
  - update
- apiGroups:
  - airunway.ai
  resources:
  - inferenceproviderconfigs
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - airunway.ai
  resources:
  - inferenceproviderconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - nvidia.com
  resources:
  - dynamographdeployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - nvidia.com
  resources:
  - dynamographdeployments/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Read live consumer ownership, including old Pods during rollout.
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets]
  verbs: [get, list, watch]
- apiGroups: [ray.io]
  resources: [rayservices, rayclusters]
  verbs: [get, list, watch]
- apiGroups: [nvidia.com]
  resources: [dynamocomponentdeployments]
  verbs: [get, list, watch]
- apiGroups: [leaderworkerset.x-k8s.io]
  resources: [leaderworkersets]
  verbs: [get, list, watch]
- apiGroups: [grove.io]
  resources: [podcliques, podcliquescalinggroups, podcliquesets]
  verbs: [get, list, watch]
