apiVersion: airunway.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: llama-gw-e2e
  namespace: default
spec:
  model:
    source: custom
  resources:
    cpu: "1"
  image: "ghcr.io/kaito-project/aikit/llama3.2:1b"
  gateway:
    enabled: true
    # modelName intentionally omitted to exercise discovery from /v1/models.
---
apiVersion: airunway.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: gemma-gw-e2e
  namespace: default
spec:
  model:
    source: custom
  resources:
    cpu: "1"
  image: "ghcr.io/kaito-project/aikit/gemma2:2b"
  gateway:
    enabled: true
    modelName: "gemma-2-2b-instruct"
