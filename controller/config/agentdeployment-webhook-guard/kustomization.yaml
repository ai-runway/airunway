apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply this cluster-scoped guard before changing the controller Deployment.
# Its deliberately unresolved Service reference makes AgentDeployment CREATE
# and UPDATE fail during mutating admission, before any old side-effecting
# validating webhook can persist credential-admission state during a rollout.
resources:
- mutating_webhook_configuration.yaml
