---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: agentproviderconfigs.airunway.ai
spec:
  group: airunway.ai
  names:
    kind: AgentProviderConfig
    listKind: AgentProviderConfigList
    plural: agentproviderconfigs
    shortNames:
    - apc
    singular: agentproviderconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .spec.capabilities.backend
      name: Backend
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentProviderConfig registers an agent framework with AI Runway. It is
          the agent-marketplace analogue of InferenceProviderConfig.

          The name is constrained to match what AgentDeployment.spec.framework.name
          accepts. Cluster-scoped resources otherwise permit DNS-1123 subdomains — dots
          and up to 253 characters — so without this a framework called "my.framework"
          registers happily, reports Ready, shows a green marketplace tile, and then
          every AgentDeployment naming it is rejected by the API server. The failure
          would surface on the user's object rather than on the misnamed registration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec is required. Without it controller-gen omits `required: [spec]` from
              the CRD, which lets `kubectl patch --type=json -p '[{"op":"remove",
              "path":"/spec"}]'` succeed — and because CEL transition rules only run
              when the old value exists, that is enough to bypass the immutability rule
              on capabilities.backend and re-create the config with a different backend.
            properties:
              capabilities:
                description: |-
                  capabilities declares what this framework supports. Required
                  because the core controller cannot render an agent workload
                  without knowing the provider's backend (see
                  AgentProviderCapabilities.Backend).
                properties:
                  backend:
                    description: |-
                      backend identifies the rendering strategy this provider uses
                      (crd-native vs container-based). It is required because the core
                      controller cannot determine how to render an agent workload
                      without it, and it backs the Backend printer column. It is immutable:
                      changing it would hand already-admitted agents to a different reconciler
                      while the original keeps filtering by framework name, so both would
                      render and force-own the same resources. See AgentProviderBackend for
                      values.
                    enum:
                    - crd
                    - container
                    type: string
                    x-kubernetes-validations:
                    - message: backend is immutable
                      rule: self == oldSelf
                  modelBindingModes:
                    description: |-
                      modelBindingModes is the set of model-binding modes the framework
                      implementation natively supports. The core controller refuses
                      AgentDeployments whose binding mode is not in this set.
                    items:
                      description: ModelBindingMode identifies how the agent resolves
                        its model endpoint.
                      enum:
                      - deploymentRef
                      - gatewayEndpoint
                      - externalAPI
                      type: string
                    type: array
                  operatorAPIGroup:
                    description: |-
                      operatorAPIGroup is the Kubernetes API group of the upstream
                      operator this framework renders into (e.g. "kagent.dev" or
                      "core.orka.ai"). When set for a crd backend, the controller marks
                      the provider ready only once this API group is served in the
                      cluster, so agents are never rendered before the operator is
                      installed. Ignored for container backends, which have no operator.

                      May also pin a version as "group/version" (e.g. "kagent.dev/v1alpha2"),
                      which is what a renderer targeting a specific version should use. A
                      group-only value cannot distinguish an operator serving the version the
                      renderer needs from one serving only an older, incompatible version — the
                      framework would report Ready, agents would bind to it, and every render
                      would then fail with "no matches for kind ... in version ...". Pinning the
                      version moves that from a permanent per-agent error loop to a clear
                      OperatorNotInstalled on the framework itself.
                    type: string
                  protocols:
                    description: |-
                      protocols is the set of tool/agent protocols the framework
                      natively understands.
                    items:
                      description: |-
                        AgentToolProtocol identifies a tool-calling protocol the framework
                        can natively consume.
                      enum:
                      - mcp
                      - a2a
                      - openaiTools
                      type: string
                    type: array
                  requiresOperator:
                    description: |-
                      requiresOperator indicates the framework relies on an upstream
                      Kubernetes operator/CRD being installed in the cluster (e.g.
                      Kagent). The dashboard uses this to gate "install upstream"
                      flows. Mirrors InferenceProviderConfig.requiresCRD semantics.
                    type: boolean
                  writableRootFilesystem:
                    description: |-
                      writableRootFilesystem relaxes the container backend's hardened
                      read-only root filesystem for frameworks that legitimately need a
                      writable root (e.g. images that write outside /tmp). This is a
                      provider-owned property of the framework, NOT a user-facing knob:
                      it lives here on the framework's capabilities, not on an
                      AgentDeployment, so a deployment author cannot weaken the security
                      posture. A writable /tmp is always provided regardless. Ignored for
                      crd backends, whose upstream operator owns pod security.
                    type: boolean
                required:
                - backend
                type: object
            required:
            - capabilities
            type: object
          status:
            description: |-
              AgentProviderConfigStatus reports whether a framework is ready to accept
              AgentDeployments.

              The framework provider writes version and lastHeartbeat. The core readiness
              reconciler requires a fresh provider heartbeat, then combines it with backend
              metadata and operator-API discovery to publish ready and the Ready condition.
            properties:
              conditions:
                description: conditions follow the standard Kubernetes condition pattern.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHeartbeat:
                description: |-
                  lastHeartbeat is the most recent write by the framework provider process.
                  Core treats a missing or stale heartbeat as provider unavailability.
                format: date-time
                type: string
              ready:
                description: |-
                  ready indicates whether the framework provider controller is
                  healthy and willing to accept AgentDeployments. The dashboard
                  uses this for the marketplace tile state.

                  Pointer-to-bool so providers can distinguish "not yet reported"
                  (nil) from "explicitly not ready" (false). A plain bool with
                  omitempty would silently collapse those two states.
                type: boolean
              version:
                description: |-
                  version is the running provider controller version. Useful for
                  surfacing shim drift between the dashboard and the provider.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be a lower-case DNS label of at most 63 characters,
            because AgentDeployment.spec.framework.name references it and is constrained
            to exactly that shape
          rule: self.metadata.name.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources:
      status: {}
